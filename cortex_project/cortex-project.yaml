version: 1
artifacts:
  - path: GROWTH_ANALYTICS.osi.yaml
    type: osi_semantic_view
    targets:
      default:
        object: SV_EVAL_CICD.APP.GROWTH_ANALYTICS
  - path: GROWTH_AGENT.agent.yaml
    type: cortex_agent
    targets:
      default:
        object: SV_EVAL_CICD.APP.GROWTH_AGENT
  - path: growth_analytics_sv.eval.yaml
    type: cortex_analyst_eval
    targets:
      default:
        object: SV_EVAL_CICD.APP.GROWTH_ANALYTICS
  - path: growth_agent_eval.eval.yaml
    type: cortex_eval
    targets:
      default:
        object: SV_EVAL_CICD.APP.GROWTH_AGENT
  - path: GROWTH_ANALYTICS_APP.py
    type: streamlit
    targets:
      default:
        object: SV_EVAL_CICD.APP.GROWTH_ANALYTICS_APP
